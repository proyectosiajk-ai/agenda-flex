<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Dashboard FLEX 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #FFFFFF;
            --bg-secondary: #F5F5F5;
            --text-primary: #1A1A1A;
            --text-secondary: #555555;
            --border-color: #E0E0E0;
            --header-bg: #333333;
            --header-text: #FFFFFF;
        }

        [data-theme="dark"] {
            --bg-primary: #1E1E1E;
            --bg-secondary: #2D2D2D;
            --text-primary: #E8E8E8;
            --text-secondary: #AAAAAA;
            --border-color: #404040;
            --header-bg: #121212;
            --header-text: #E8E8E8;
        }

        body {
            background: var(--bg-secondary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: var(--header-bg);
            color: var(--header-text);
            border-radius: 8px;
            position: relative;
        }

        .header-left {
            position: absolute;
            left: 1.5rem;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            width: 50px;
            height: 50px;
            background: var(--bg-primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 10px;
            color: #333;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
        }

        .theme-switch {
            position: absolute;
            right: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .switch {
            position: relative;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255,255,255,0.3);
            transition: 0.4s;
            border-radius: 26px;
            border: 1px solid rgba(255,255,255,0.4);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: rgba(255,255,255,0.5);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .theme-label {
            font-size: 12px;
            font-weight: 500;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border-color);
        }

        .tab-btn {
            padding: 12px 20px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            font-size: 14px;
        }

        .tab-btn.active {
            color: var(--text-primary);
            border-bottom-color: #333;
        }

        [data-theme="dark"] .tab-btn.active {
            border-bottom-color: #E8E8E8;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-section {
            background: var(--bg-primary);
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .form-section h2 {
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            font-size: 18px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 13px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #333;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            font-size: 13px;
        }

        .btn-primary {
            background: #333;
            color: white;
        }

        .btn-primary:hover {
            background: #555;
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-danger {
            background: #D32F2F;
            color: white;
        }

        .btn-danger:hover {
            background: #B71C1C;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .table-section {
            background: var(--bg-primary);
            padding: 2rem;
            border-radius: 8px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table thead {
            background: var(--bg-secondary);
        }

        table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-color);
            font-size: 13px;
        }

        table td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--text-secondary);
        }

        table tr:hover {
            background: var(--bg-secondary);
        }

        .task-row-client {
            color: var(--text-primary);
            font-weight: 600;
        }

        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            margin-right: 4px;
            color: #FFFFFF;
        }

        .tag-verde { background: #388E3C; }
        .tag-amarillo { background: #F57C00; }
        .tag-rojo { background: #D32F2F; }
        .tag-morado { background: #7B1FA2; }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 13px;
            background: #E8F5E9;
            color: #1B5E20;
            border: 1px solid #C8E6C9;
        }

        .no-data {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 1.5rem;
        }

        .modal-close {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
        }
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            cursor: pointer;
        }

        .checkbox-label input {
            cursor: pointer;
        }
    </style>
</head>
<body data-theme="light">
    <div class="container">
        <div class="header">
            <div class="header-left">
                <div class="logo">FLEX</div>
            </div>
            <div class="header-title">Admin - Gestión de Tareas</div>
            <div class="theme-switch">
                <span class="theme-label">☀️</span>
                <label class="switch">
                    <input type="checkbox" id="themeToggle">
                    <span class="slider"></span>
                </label>
                <span class="theme-label">🌙</span>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tareas')">📋 Tareas</button>
            <button class="tab-btn" onclick="switchTab('fechas')">📅 Fechas</button>
            <button class="tab-btn" onclick="switchTab('config')">⚙️ Configuración</button>
        </div>

        <!-- TAB: TAREAS -->
        <div id="tareas" class="tab-content active">
            <div class="form-section">
                <h2>➕ Nueva Tarea</h2>
                <div id="successAlert"></div>
                <form id="taskForm" onsubmit="addTask(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Cliente</label>
                            <input type="text" id="cliente" required>
                        </div>
                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="text" id="phone">
                        </div>
                        <div class="form-group">
                            <label>Hora</label>
                            <input type="time" id="hora" required>
                        </div>
                        <div class="form-group">
                            <label>Día</label>
                            <select id="day" required>
                                <option value="lunes">Lunes</option>
                                <option value="martes">Martes</option>
                                <option value="miercoles">Miércoles</option>
                                <option value="jueves">Jueves</option>
                                <option value="viernes">Viernes</option>
                                <option value="sabado">Sábado</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Lugar</label>
                            <input type="text" id="lugar" required>
                        </div>
                        <div class="form-group">
                            <label>Detalle</label>
                            <input type="text" id="detalle" required>
                        </div>
                        <div class="form-group">
                            <label>Responsables (separados por comas)</label>
                            <input type="text" id="responsables">
                        </div>
                        <div class="form-group">
                            <label>Deadline</label>
                            <input type="datetime-local" id="deadline" required>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label>Etiquetas</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" name="tags" value="verde">
                                🟢 Cliente retira
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="tags" value="amarillo">
                                🟡 Mensajería
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="tags" value="rojo">
                                🔴 Instalación
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="tags" value="morado">
                                🟣 Envío externo
                            </label>
                        </div>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">Crear Tarea</button>
                        <button type="reset" class="btn btn-secondary">Limpiar</button>
                    </div>
                </form>
            </div>

            <div class="table-section">
                <h2 style="margin-bottom: 1.5rem;">📊 Tareas Existentes</h2>
                <div id="tasksTable"></div>
            </div>
        </div>

        <!-- TAB: FECHAS -->
        <div id="fechas" class="tab-content">
            <div class="form-section">
                <h2>📅 Asignar Fechas</h2>
                <form id="datesForm" onsubmit="saveDates(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Lunes</label>
                            <input type="date" id="fecha-lunes" required>
                        </div>
                        <div class="form-group">
                            <label>Martes</label>
                            <input type="date" id="fecha-martes" required>
                        </div>
                        <div class="form-group">
                            <label>Miércoles</label>
                            <input type="date" id="fecha-miercoles" required>
                        </div>
                        <div class="form-group">
                            <label>Jueves</label>
                            <input type="date" id="fecha-jueves" required>
                        </div>
                        <div class="form-group">
                            <label>Viernes</label>
                            <input type="date" id="fecha-viernes" required>
                        </div>
                        <div class="form-group">
                            <label>Sábado</label>
                            <input type="date" id="fecha-sabado" required>
                        </div>
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">Guardar Fechas</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- TAB: CONFIGURACION -->
        <div id="config" class="tab-content">
            <div class="form-section">
                <h2>⚙️ Configurar Deadlines</h2>
                <form id="configForm" onsubmit="saveConfig(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Verde (más de X horas)</label>
                            <input type="number" id="greenHours" value="48" min="1">
                        </div>
                        <div class="form-group">
                            <label>Amarillo (X a Y horas)</label>
                            <input type="number" id="yellowMin" value="24" min="1">
                        </div>
                        <div class="form-group">
                            <label>Rojo (menos de X horas)</label>
                            <input type="number" id="redHours" value="24" min="1">
                        </div>
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL EDITAR -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeEditModal()">&times;</span>
            <h2>✏️ Editar Tarea</h2>
            <form id="editForm" onsubmit="saveEditTask(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Cliente</label>
                        <input type="text" id="edit-cliente" required>
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" id="edit-phone">
                    </div>
                    <div class="form-group">
                        <label>Hora</label>
                        <input type="time" id="edit-hora" required>
                    </div>
                    <div class="form-group">
                        <label>Día</label>
                        <select id="edit-day" required>
                            <option value="lunes">Lunes</option>
                            <option value="martes">Martes</option>
                            <option value="miercoles">Miércoles</option>
                            <option value="jueves">Jueves</option>
                            <option value="viernes">Viernes</option>
                            <option value="sabado">Sábado</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Lugar</label>
                        <input type="text" id="edit-lugar" required>
                    </div>
                    <div class="form-group">
                        <label>Detalle</label>
                        <input type="text" id="edit-detalle" required>
                    </div>
                    <div class="form-group">
                        <label>Responsables</label>
                        <input type="text" id="edit-responsables">
                    </div>
                    <div class="form-group">
                        <label>Deadline</label>
                        <input type="datetime-local" id="edit-deadline" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label>Etiquetas</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="edit-tags" value="verde">
                            🟢 Cliente retira
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="edit-tags" value="amarillo">
                            🟡 Mensajería
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="edit-tags" value="rojo">
                            🔴 Instalación
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="edit-tags" value="morado">
                            🟣 Envío externo
                        </label>
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const DAYS = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
        const DAYS_LABEL = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

        let tasks = {};
        let dayDates = {};
        let config = { greenHours: 48, yellowMin: 24, redHours: 24 };

        DAYS.forEach(day => tasks[day] = []);

        // Cargar datos
        function loadData() {
            const saved = localStorage.getItem('dashboardTasks');
            const savedDates = localStorage.getItem('dayDates');
            const savedConfig = localStorage.getItem('dashboardConfig');
            if (saved) tasks = JSON.parse(saved);
            if (savedDates) dayDates = JSON.parse(savedDates);
            if (savedConfig) config = JSON.parse(savedConfig);
        }

        // Guardar datos
        function saveData() {
            localStorage.setItem('dashboardTasks', JSON.stringify(tasks));
            localStorage.setItem('dayDates', JSON.stringify(dayDates));
            localStorage.setItem('dashboardConfig', JSON.stringify(config));
        }

        // Agregar tarea
        function addTask(e) {
            e.preventDefault();
            const cliente = document.getElementById('cliente').value;
            const phone = document.getElementById('phone').value;
            const hora = document.getElementById('hora').value;
            const day = document.getElementById('day').value;
            const lugar = document.getElementById('lugar').value;
            const detalle = document.getElementById('detalle').value;
            const responsables = document.getElementById('responsables').value.split(',').map(r => r.trim()).filter(r => r);
            const deadline = document.getElementById('deadline').value;

            const tagCheckboxes = document.querySelectorAll('input[name="tags"]:checked');
            const tags = Array.from(tagCheckboxes).map(cb => cb.value);

            if (tags.length === 0) {
                alert('Selecciona al menos una etiqueta');
                return;
            }

            const task = { cliente, phone, hora, lugar, detalle, responsables, deadline, tags };
            tasks[day].push(task);
            saveData();
            document.getElementById('taskForm').reset();
            showAlert('✓ Tarea creada');
            renderTasks();
        }

        // Eliminar tarea
        function deleteTask(day, index) {
            if (confirm('¿Eliminar?')) {
                tasks[day].splice(index, 1);
                saveData();
                renderTasks();
            }
        }

        // Variables para edición
        let editingTask = { day: null, index: null };

        // Abrir modal de edición
        function openEditModal(day, index) {
            editingTask = { day, index };
            const task = tasks[day][index];

            document.getElementById('edit-cliente').value = task.cliente;
            document.getElementById('edit-phone').value = task.phone || '';
            document.getElementById('edit-hora').value = task.hora;
            document.getElementById('edit-day').value = day;
            document.getElementById('edit-lugar').value = task.lugar;
            document.getElementById('edit-detalle').value = task.detalle;
            document.getElementById('edit-responsables').value = task.responsables.join(', ');
            document.getElementById('edit-deadline').value = task.deadline;

            document.querySelectorAll('input[name="edit-tags"]').forEach(checkbox => {
                checkbox.checked = task.tags.includes(checkbox.value);
            });

            document.getElementById('editModal').classList.add('active');
        }

        // Cerrar modal
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            editingTask = { day: null, index: null };
        }

        // Guardar cambios de tarea
        function saveEditTask(e) {
            e.preventDefault();

            const newDay = document.getElementById('edit-day').value;
            const cliente = document.getElementById('edit-cliente').value;
            const phone = document.getElementById('edit-phone').value;
            const hora = document.getElementById('edit-hora').value;
            const lugar = document.getElementById('edit-lugar').value;
            const detalle = document.getElementById('edit-detalle').value;
            const responsables = document.getElementById('edit-responsables').value.split(',').map(r => r.trim()).filter(r => r);
            const deadline = document.getElementById('edit-deadline').value;

            const tagCheckboxes = document.querySelectorAll('input[name="edit-tags"]:checked');
            const tags = Array.from(tagCheckboxes).map(cb => cb.value);

            if (tags.length === 0) {
                alert('Selecciona al menos una etiqueta');
                return;
            }

            // Si cambió de día, eliminar de día anterior
            if (newDay !== editingTask.day) {
                tasks[editingTask.day].splice(editingTask.index, 1);
            }

            const updatedTask = { cliente, phone, hora, lugar, detalle, responsables, deadline, tags };
            
            if (newDay === editingTask.day) {
                tasks[newDay][editingTask.index] = updatedTask;
            } else {
                tasks[newDay].push(updatedTask);
            }

            saveData();
            renderTasks();
            closeEditModal();
            showAlert('✓ Tarea actualizada');
        }

        // Renderizar tareas
        function renderTasks() {
            const table = document.getElementById('tasksTable');
            let allTasks = [];
            DAYS.forEach(day => {
                tasks[day].forEach((task, index) => {
                    allTasks.push({ day, index, task });
                });
            });

            if (allTasks.length === 0) {
                table.innerHTML = '<div class="no-data">Sin tareas</div>';
                return;
            }

            let html = '<table><thead><tr><th>Cliente</th><th>Día</th><th>Hora</th><th>Lugar</th><th>Detalle</th><th>Responsables</th><th>Etiquetas</th><th>Acciones</th></tr></thead><tbody>';

            allTasks.forEach(({ day, index, task }) => {
                const tagsHtml = task.tags.map(t => `<span class="tag tag-${t}">${t.toUpperCase()}</span>`).join('');
                const responsablesHtml = task.responsables.join(', ') || '-';
                const dayLabel = DAYS_LABEL[DAYS.indexOf(day)];

                html += `<tr>
                    <td class="task-row-client">${task.cliente}</td>
                    <td>${dayLabel}</td>
                    <td>${task.hora}</td>
                    <td>${task.lugar}</td>
                    <td>${task.detalle}</td>
                    <td>${responsablesHtml}</td>
                    <td>${tagsHtml}</td>
                    <td>
                        <button class="btn btn-primary btn-small" onclick="openEditModal('${day}', ${index})" style="margin-bottom: 4px;">Editar</button>
                        <button class="btn btn-danger btn-small" onclick="deleteTask('${day}', ${index})">Eliminar</button>
                    </td>
                </tr>`;
            });

            html += '</tbody></table>';
            table.innerHTML = html;
        }

        // Guardar fechas
        function saveDates(e) {
            e.preventDefault();
            DAYS.forEach(day => {
                const dateValue = document.getElementById(`fecha-${day}`).value;
                if (dateValue) {
                    const date = new Date(dateValue);
                    dayDates[day] = date.toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });
                }
            });
            saveData();
            showAlert('✓ Fechas guardadas');
        }

        // Guardar config
        function saveConfig(e) {
            e.preventDefault();
            config.greenHours = parseInt(document.getElementById('greenHours').value);
            config.yellowMin = parseInt(document.getElementById('yellowMin').value);
            config.redHours = parseInt(document.getElementById('redHours').value);
            saveData();
            showAlert('✓ Configuración guardada');
        }

        // Mostrar alerta
        function showAlert(msg) {
            const alert = document.getElementById('successAlert');
            alert.innerHTML = `<div class="alert">${msg}</div>`;
            setTimeout(() => alert.innerHTML = '', 3000);
        }

        // Cambiar tab
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        // Switch tema
        document.getElementById('themeToggle').addEventListener('change', function() {
            const theme = this.checked ? 'dark' : 'light';
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        });

        // Cargar tema
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'dark') document.getElementById('themeToggle').checked = true;

        // Inicializar
        loadData();
        renderTasks();
        document.getElementById('greenHours').value = config.greenHours;
        document.getElementById('yellowMin').value = config.yellowMin;
        document.getElementById('redHours').value = config.redHours;
