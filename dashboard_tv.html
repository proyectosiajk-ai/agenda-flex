<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard TV - Agenda de Tareas FLEX 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #FFFFFF;
            --bg-secondary: #F5F5F5;
            --text-primary: #1A1A1A;
            --text-secondary: #555555;
            --border-color: #E0E0E0;
            --header-bg: #333333;
            --header-text: #FFFFFF;
            --card-shadow: rgba(0,0,0,0.08);
        }

        [data-theme="dark"] {
            --bg-primary: #1E1E1E;
            --bg-secondary: #2D2D2D;
            --text-primary: #E8E8E8;
            --text-secondary: #AAAAAA;
            --border-color: #404040;
            --header-bg: #0A0A0A;
            --header-text: #E8E8E8;
            --card-shadow: rgba(0,0,0,0.3);
        }

        @keyframes pulse-red {
            0%, 100% { border-color: #D32F2F; }
            50% { border-color: transparent; }
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg-secondary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem 2rem;
            background: var(--header-bg);
            color: var(--header-text);
            box-shadow: 0 2px 8px var(--card-shadow);
            flex-shrink: 0;
            position: relative;
        }

        .header-left {
            position: absolute;
            left: 2rem;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: var(--bg-primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 11px;
            flex-shrink: 0;
            color: #333;
        }

        .header-title {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .toggle-btn {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 24px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
            color: var(--header-text);
            font-weight: 500;
            transition: all 0.2s;
        }

        .toggle-btn:hover {
            background: rgba(255,255,255,0.18);
        }

        .toggle-btn.active {
            background: rgba(255,255,255,0.28);
            border-color: rgba(255,255,255,0.4);
        }

        .main-content {
            flex: 1;
            overflow: hidden;
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            height: 100%;
            overflow-y: auto;
        }

        .board::-webkit-scrollbar {
            width: 8px;
        }

        .board::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .board::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .board::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }

        .column-header {
            background: var(--header-bg);
            color: var(--header-text);
            border-radius: 6px;
            padding: 12px;
            text-align: center;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        .tasks-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
            padding-right: 6px;
        }

        .tasks-container::-webkit-scrollbar {
            width: 6px;
        }

        .tasks-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .tasks-container::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.15);
            border-radius: 3px;
        }

        .task-card {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 11px;
            border-left: 4px solid;
            box-shadow: 0 2px 6px var(--card-shadow);
            transition: all 0.2s;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .task-card.verde { border-left-color: #388E3C; }
        .task-card.amarillo { border-left-color: #F57C00; }
        .task-card.rojo { 
            border-left-color: #D32F2F; 
            animation: pulse-red 2s infinite;
        }

        .task-client {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.25;
            margin-bottom: 6px;
            word-break: break-word;
        }

        .task-time {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .task-deadline {
            font-size: 11px;
            color: var(--text-primary);
            font-weight: 600;
            padding: 5px 8px;
            background: var(--bg-secondary);
            border-radius: 4px;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .task-progress-bar {
            width: 100%;
            height: 5px;
            background: var(--border-color);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .task-progress-fill {
            height: 100%;
            background: #388E3C;
            transition: all 0.3s;
        }

        .task-progress-fill.amarillo {
            background: #F57C00;
        }

        .task-progress-fill.rojo {
            background: #D32F2F;
        }

        .task-info {
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .task-info-row {
            display: flex;
            gap: 6px;
        }

        .task-info-label {
            font-weight: 700;
            color: var(--text-primary);
            min-width: 24px;
            flex-shrink: 0;
        }

        .task-info-text {
            word-break: break-word;
            flex: 1;
        }

        .task-responsables {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        .badge-responsable {
            display: inline-block;
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 3px 7px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
        }

        .task-tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 3px 7px;
            border-radius: 12px;
            font-size: 9px;
            font-weight: 700;
            white-space: nowrap;
        }

        .tag-verde { background: #E8F5E9; color: #1B5E20; }
        [data-theme="dark"] .tag-verde { background: rgba(56, 142, 60, 0.25); color: #81C784; }

        .tag-amarillo { background: #FFF3E0; color: #E65100; }
        [data-theme="dark"] .tag-amarillo { background: rgba(245, 124, 0, 0.25); color: #FFB74D; }

        .tag-rojo { background: #FFEBEE; color: #B71C1C; }
        [data-theme="dark"] .tag-rojo { background: rgba(211, 47, 47, 0.25); color: #EF5350; }

        .tag-morado { background: #F3E5F5; color: #4A148C; }
        [data-theme="dark"] .tag-morado { background: rgba(123, 31, 162, 0.25); color: #CE93D8; }

        .empty {
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            padding: 2rem 0;
            font-weight: 500;
            margin-top: 1rem;
        }

        .admin-info {
            position: absolute;
            bottom: 10px;
            right: 20px;
            font-size: 11px;
            color: var(--text-secondary);
            opacity: 0.6;
        }

        /* Responsivo para diferentes tamaños */
        @media (max-width: 1920px) {
            .header {
                padding: 1.25rem 1.5rem;
            }

            .header-title {
                font-size: 24px;
            }

            .logo {
                width: 50px;
                height: 50px;
                font-size: 10px;
            }
        }

        @media (max-width: 1440px) {
            .board {
                gap: 14px;
            }

            .task-card {
                padding: 10px;
                min-height: 110px;
            }

            .task-client {
                font-size: 14px;
            }

            .column-header {
                padding: 10px;
                font-size: 14px;
            }
        }

        @media (max-width: 1200px) {
            .board {
                grid-template-columns: repeat(4, 1fr);
                gap: 12px;
            }

            .main-content {
                padding: 1rem;
            }
        }

        @media (max-width: 768px) {
            .board {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .header {
                padding: 1rem;
            }

            .header-title {
                font-size: 18px;
            }

            .logo {
                width: 40px;
                height: 40px;
            }

            .main-content {
                padding: 0.75rem;
            }

            .task-card {
                padding: 9px;
                min-height: 100px;
            }

            .task-client {
                font-size: 13px;
            }

            .task-time {
                font-size: 11px;
            }

            .task-info {
                font-size: 10px;
            }
        }
    </style>
</head>
<body data-theme="light">
    <div class="header">
        <div class="header-left">
            <div class="logo">FLEX</div>
        </div>
        <div class="header-title">Agenda Diaria de Tareas</div>
    </div>

    <div class="main-content">
        <div class="board" id="board"></div>
    </div>

    <div class="admin-info">Sincronización en tiempo real</div>

    <script>
        const DAYS = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
        const DAYS_LABEL = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
        
        let tasks = {};
        DAYS.forEach(day => tasks[day] = []);

        // Cargar datos
        function loadData() {
            const saved = localStorage.getItem('dashboardTasks');
            if (saved) tasks = JSON.parse(saved);
        }

        // Calcular color del deadline
        function getDeadlineColor(deadline) {
            const now = new Date();
            const diff = new Date(deadline) - now;
            const hours = diff / (1000 * 60 * 60);

            if (hours > 48) return 'verde';
            if (hours > 24) return 'amarillo';
            return 'rojo';
        }

        // Calcular tiempo restante
        function getTimeRemaining(deadline) {
            const now = new Date();
            const diff = new Date(deadline) - now;
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            if (hours < 0) return '⏰ Vencida';
            if (hours === 0) return `⏰ ${minutes}m`;
            if (hours < 24) return `⏰ ${hours}h ${minutes}m`;
            return `⏰ ${Math.floor(hours / 24)}d ${hours % 24}h`;
        }

        // Calcular porcentaje de progreso
        function getProgressPercent(deadline) {
            const now = new Date();
            const diff = new Date(deadline) - now;
            const hours = diff / (1000 * 60 * 60);
            
            // Asume que todas las tareas duran máximo 72 horas desde ahora
            const maxHours = 72;
            const percent = Math.max(0, Math.min(100, 100 - (hours / maxHours * 100)));
            return percent;
        }

        // Renderizar board
        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';

            DAYS.forEach((day, index) => {
                const column = document.createElement('div');
                column.className = 'column';

                const header = document.createElement('div');
                header.className = 'column-header';
                header.textContent = DAYS_LABEL[index];
                column.appendChild(header);

                const tasksContainer = document.createElement('div');
                tasksContainer.className = 'tasks-container';

                const dayTasks = tasks[day] || [];
                if (dayTasks.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty';
                    empty.textContent = 'Sin tareas';
                    tasksContainer.appendChild(empty);
                } else {
                    dayTasks.forEach((task) => {
                        const card = document.createElement('div');
                        const borderColor = getDeadlineColor(task.deadline);
                        card.className = `task-card ${borderColor}`;

                        const tagsHtml = task.tags.map(t => {
                            const tagLabels = {
                                'verde': 'Retira',
                                'amarillo': 'Mensajería',
                                'rojo': 'Instalación',
                                'morado': 'Envío'
                            };
                            return `<span class="tag tag-${t}">${tagLabels[t]}</span>`;
                        }).join('');

                        const responsablesHtml = task.responsables.map(r => `<span class="badge-responsable">${r}</span>`).join('');

                        const progressPercent = getProgressPercent(task.deadline);

                        card.innerHTML = `
                            <div>
                                <div class="task-client">${task.cliente}</div>
                                <div class="task-time">${task.hora}</div>
                                <div class="task-deadline">${getTimeRemaining(task.deadline)}</div>
                                <div class="task-progress-bar">
                                    <div class="task-progress-fill ${borderColor}" style="width: ${progressPercent}%;"></div>
                                </div>
                                <div class="task-info">
                                    <div class="task-info-row">
                                        <span class="task-info-label">📍</span>
                                        <span class="task-info-text">${task.lugar}</span>
                                    </div>
                                    <div class="task-info-row">
                                        <span class="task-info-label">🎨</span>
                                        <span class="task-info-text">${task.detalle}</span>
                                    </div>
                                </div>
                                <div class="task-responsables">${responsablesHtml}</div>
                            </div>
                            <div class="task-tags">${tagsHtml}</div>
                        `;
                        tasksContainer.appendChild(card);
                    });
                }

                column.appendChild(tasksContainer);
                board.appendChild(column);
            });
        }

        // Sincronizar tema desde Admin
        function syncTheme() {
            const theme = localStorage.getItem('theme') || 'light';
            document.body.setAttribute('data-theme', theme);
        }

        // Llamar al cargar
        syncTheme();

        // Inicializar
        loadData();
        renderBoard();

        // Sincronizar en tiempo real cada 1 segundo
        setInterval(() => {
            loadData();  // Recargar datos desde localStorage
            renderBoard();
            syncTheme();
        }, 1000);
    </script>
</body>
</html>
